# Production overlay on the one layout (docker-compose.yml). Tracked since
# 2026-10-19; it replaces the untracked docker-compose.serverports.yml that
# lived only on the prod box, where no review or test could see it.
#
# Prod's .env carries
#   COMPOSE_FILE=gdx_dispatch/docker/docker-compose.yml:gdx_dispatch/docker/docker-compose.prod.yml
#   GDX_REQUIRE_EXISTING_DATA=1
# so a bare `docker compose -p gdx …` from the repo root includes this file,
# and update.sh reads the same line. The base alone (an explicit
# `-f docker-compose.yml`) stops in bootstrap instead of serving a fresh, empty
# database only when the lock reaches it: with `--env-file ./.env`, as every
# runbook passes. Without it compose reads .env from gdx_dispatch/docker/,
# which prod does not have, and neither lock applies. update.sh has a third:
# it refuses when the files resolve the database to a volume that does not
# exist.
#
# What differs from a customer install, and why:
#   - The gdx-nginx container (config in /var/www/gdx/infra, outside this repo)
#     terminates TLS with certbot's certificates and proxies to
#     http://gdx-app-1:8000 through Docker's DNS, on the network gdx_default.
#     So app joins that network as `proxy`. External, because the old layout
#     created it and gdx-nginx was attached to it by hand (its own compose
#     file names no networks): compose must neither create nor delete it.
#     Without this network every domain answers 502 after the switch while
#     update.sh reports success (/audit, 2026-10-20). Caddy never starts (its
#     profile is never enabled); the port on 127.0.0.1:8002 is for checks
#     from the host.
#   - The five DATA volumes are prod's existing ones, by name. external: true
#     means compose never creates or deletes them; a missing one aborts `up`
#     instead of silently starting empty. Secrets, backups and the Caddy
#     volumes have no prod predecessor, so the base creates them fresh.
#   - More worker concurrency than a 2-vCPU customer box gets.
# Prod's project name, so a bare `docker compose` from the repo root (which
# COMPOSE_FILE points at both files) is the same stack update.sh runs with
# `-p gdx`. Without it compose names the project after the first file's
# directory, `docker`, and starts a second postgres on prod's external
# database volume (/audit, 2026-10-20). gdx-nginx resolves gdx-app-1 by name.
name: gdx

services:
  app:
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      proxy: {}
    environment:
      # The phone.com webhook rotation builds its URLs from this; without it
      # they point at example.com (v1.24.2 refuses that instead of breaking).
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      # Voice-note transcription key, app only. NOT plugin-host: there an
      # OPENAI_API_KEY would override the Door Quote plugin's own key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Prod's worker processes per queue (the split layout's -c 4 / -c 2).
      GDX_CELERY_HIGH_CONCURRENCY: ${GDX_CELERY_HIGH_CONCURRENCY:-4}
      GDX_CELERY_LOW_CONCURRENCY: ${GDX_CELERY_LOW_CONCURRENCY:-2}
  caddy:
    profiles: ["prod-never"]

networks:
  proxy:
    external: true
    name: gdx_default

volumes:
  gdx_db_data:
    external: true
    name: docker_db_data
  gdx_uploads:
    external: true
    name: docker_gdx_uploads
  gdx_recordings:
    external: true
    name: gdx_gdx_recordings
  gdx_plugins:
    external: true
    name: gdx_gdx_plugins
  gdx_redis_data:
    external: true
    name: gdx_redis_data

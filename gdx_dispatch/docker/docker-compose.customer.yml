# ═══════════════════════════════════════════════════════════════════════════
# GDX Dispatch — one-click self-host deployment
# ═══════════════════════════════════════════════════════════════════════════
#
# A single, self-contained Compose file: paste its URL into Hostinger's
# Docker Manager ("Compose from URL"), any Docker host's compose CLI, or
# reach it through the Deploy on Hostinger button. Zero configuration
# required — a bare `up` boots a working app on http://<server-ip>.
#
#   docker compose -p gdx -f docker-compose.customer.yml up -d
#
# What happens on first boot, in order:
#   1. secrets-init mints strong secrets (session/JWT/encryption keys, DB
#      password) and persists them to the `gdx_secrets` volume — restarts and
#      updates reuse them, so logins and encrypted data survive.
#   2. postgres + redis start; the app runs migrations and seeds YOUR admin
#      account — the generated password is printed ONCE in the app logs
#      (Docker Manager → app container → Logs, look for the banner).
#   3. Caddy serves the app on port 80 — or with automatic HTTPS on your
#      domain once GDX_DOMAIN is set (point the domain's DNS A record at
#      this server first).
#   4. A backup sidecar dumps the database daily to the `gdx_backups` volume
#      (30-day retention).
#
# Optional settings (environment variables — all have working defaults):
#   GDX_TENANT_NAME   Your company name, shown throughout the app.
#   GDX_ADMIN_EMAIL   Login email for the first admin account.
#   GDX_DOMAIN        e.g. dispatch.yourcompany.com → enables automatic HTTPS.
#   APP_VERSION       Release tag to run (default: latest). Redeploying this
#                     project pulls the newest image = the update path.
#   GDX_ADMIN_PASSWORD  Set to choose the admin password (otherwise generated
#                     and printed once to the app logs).
#   STRIPE_SECRET_KEY / GOOGLE_MAPS_API_KEY / QB_CLIENT_ID … integration
#                     credentials; all optional, features disable when blank.
#
# Data lives in named volumes (gdx_db_data, gdx_uploads, gdx_backups,
# gdx_secrets) — `docker compose down` without `-v` never touches them.
# License: AGPL-3.0 with plugin exception. https://github.com/freePerro/gdx_dispatch
# ═══════════════════════════════════════════════════════════════════════════

# Shared by every app-image container so they can never drift apart. Secrets
# are deliberately NOT here — secrets-init mints + persists them, and
# entrypoint.sh loads them via GDX_RUNTIME_ENV_FILE. Setting any of them as
# an env var here still wins: mint_runtime_env folds non-empty env values
# into the persisted file.
x-app-env: &app-env
  GDX_ENV: ${GDX_ENV:-production}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  REDIS_URL: redis://redis:6379/0
  GDX_RUNTIME_ENV_FILE: /secrets/runtime.env
  # ── customer-facing settings (see header) ──
  GDX_DOMAIN: ${GDX_DOMAIN:-}
  GDX_TENANT_SLUG: ${GDX_TENANT_SLUG:-gdx}
  GDX_TENANT_NAME: ${GDX_TENANT_NAME:-My Door Company}
  # ── optional secret overrides (blank = minted on first boot) ──
  SECRET_KEY: ${SECRET_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
  GDX_FERNET_KEY: ${GDX_FERNET_KEY:-}
  FERNET_KEY: ${FERNET_KEY:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  GDX_PUBLIC_BASE_URL: ${GDX_PUBLIC_BASE_URL:-}
  GDX_BASE_URL: ${GDX_BASE_URL:-}
  RS_PRIVATE_KEY: ${RS_PRIVATE_KEY:-}
  RS_PUBLIC_KEY: ${RS_PUBLIC_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  # ── optional integrations (features disable when blank) ──
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  QB_CLIENT_ID: ${QB_CLIENT_ID:-}
  QB_CLIENT_SECRET: ${QB_CLIENT_SECRET:-}
  QB_REDIRECT_URI: ${QB_REDIRECT_URI:-}
  QB_ENVIRONMENT: ${QB_ENVIRONMENT:-production}
  PLATFORM_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
  PLATFORM_SMTP_PORT: ${PLATFORM_SMTP_PORT:-465}
  PLATFORM_SMTP_USER: ${PLATFORM_SMTP_USER:-}
  PLATFORM_SMTP_PASS: ${PLATFORM_SMTP_PASS:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  # Mints + persists runtime secrets before anything else starts. Runs on
  # every `up`; a no-op once the values exist.
  secrets-init:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    entrypoint: ["python", "-m", "gdx_dispatch.tools.mint_runtime_env"]
    # Root on purpose: a fresh named volume is root-owned. The tool chowns
    # everything to the app user (uid 1000) before exiting.
    user: "0:0"
    environment:
      <<: *app-env
    volumes:
      - gdx_secrets:/secrets
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gdx
      POSTGRES_USER: gdx
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - gdx_db_data:/var/lib/postgresql/data
      - gdx_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdx -d gdx"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Runs migrations + first-boot bootstrap (tenant, company, admin account),
  # then serves the app. The other app-image services skip both — exactly one
  # container ever touches the schema.
  app:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    environment:
      <<: *app-env
      APP_VERSION: ${APP_VERSION:-latest}
      GDX_ADMIN_EMAIL: ${GDX_ADMIN_EMAIL:-admin@example.com}
      GDX_ADMIN_PASSWORD: ${GDX_ADMIN_PASSWORD:-}
    volumes:
      - gdx_uploads:/app/uploads
      - gdx_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # All installed third-party plugins run here, isolated from the core app
  # (ADR-013). Internal-only; core proxies /api/plugins/* over the network.
  plugin-host:
    image: ghcr.io/freeperro/gdx_dispatch-plugin-host:${APP_VERSION:-latest}
    pull_policy: always
    command: uvicorn gdx_dispatch.plugin_host.main:app --host 0.0.0.0 --port 8000
    # Chromium exhausts Docker's default 64MB /dev/shm without this (ADR-014).
    ipc: host
    environment:
      <<: *app-env
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
    volumes:
      - gdx_plugins:/plugins
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-high:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    # -c 2 (not prod's 4): customer boxes are 2-vCPU/8GB KVMs also running
    # postgres + Chromium-capable plugin-host; 8 prefork workers would eat
    # the box for queues a single shop never fills.
    command: celery -A gdx_dispatch.core.celery_app worker -Q priority:high -c 2 --loglevel=info
    environment:
      <<: *app-env
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
    volumes:
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  celery-low:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    command: celery -A gdx_dispatch.core.celery_app worker -Q priority:low -c 1 --loglevel=info
    environment:
      <<: *app-env
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
    volumes:
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    command: celery -A gdx_dispatch.core.celery_app beat --loglevel=info
    environment:
      <<: *app-env
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
    volumes:
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Public entrypoint. No GDX_DOMAIN → plain HTTP on port 80 (first boot,
  # http://<server-ip>). With GDX_DOMAIN set and its DNS A record pointing
  # here, Caddy obtains + renews Let's Encrypt certificates automatically;
  # the cert store lives on gdx_caddy_data so reissue limits are never hit.
  caddy:
    image: caddy:2-alpine
    environment:
      GDX_DOMAIN: ${GDX_DOMAIN:-}
    command: >
      sh -c 'if [ -n "$$GDX_DOMAIN" ];
      then exec caddy reverse-proxy --from "https://$$GDX_DOMAIN" --to app:8000;
      else exec caddy reverse-proxy --from :80 --to app:8000; fi'
    ports:
      - "${GDX_HTTP_PORT:-80}:80"
      - "${GDX_HTTPS_PORT:-443}:443"
    volumes:
      - gdx_caddy_data:/data
      - gdx_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Daily logical dump, independent of (and complementing) host snapshots.
  # pipefail + write-to-partial-then-rename so a failing pg_dump can never
  # masquerade as a good backup (gzip alone exits 0 on an empty pipe).
  # Restore: gunzip -c <file> | docker compose exec -T db psql -U gdx gdx
  backup:
    image: postgres:16-alpine
    entrypoint: >
      sh -c 'set -o pipefail; export PGPASSWORD="$$(cat /secrets/db_password)";
      while true; do
      ts="$$(date +%Y%m%d_%H%M%S)";
      if pg_dump -h db -U gdx gdx | gzip > /backups/.partial.gz;
      then mv /backups/.partial.gz "/backups/gdx_$${ts}.sql.gz"
      && echo "[backup] wrote gdx_$${ts}.sql.gz";
      else rm -f /backups/.partial.gz;
      echo "[backup] FAILED — pg_dump error, no backup written" >&2; fi;
      find /backups -name "gdx_*.sql.gz" -mtime +${GDX_BACKUP_RETAIN_DAYS:-30} -delete;
      sleep 86400; done'
    volumes:
      - gdx_secrets:/secrets:ro
      - gdx_backups:/backups
    depends_on:
      # app healthy (not just db) so the first dump captures a migrated
      # schema instead of an empty pre-bootstrap database.
      app:
        condition: service_healthy
    restart: unless-stopped

# All managed (auto-created on first deploy — required for one-click), and
# reused as long as the compose project name stays the same. Redeploying the
# project updates containers but keeps these.
volumes:
  gdx_db_data:
  gdx_uploads:
  gdx_plugins:
  gdx_secrets:
  gdx_backups:
  gdx_caddy_data:
  gdx_caddy_config:

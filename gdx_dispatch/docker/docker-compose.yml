# ═══════════════════════════════════════════════════════════════════════════
# GDX Dispatch — the one compose layout
# ═══════════════════════════════════════════════════════════════════════════
#
# Every install runs THIS file. Since 2026-10-19 there is no second layout to
# drift from it; the old base, customer, self-host and lab files were merged
# here because production and customers had been running different stacks:
#
#   customers   this file alone. release.yml publishes it as the release asset
#               docker-compose.customer.yml, so the README's curl URL and the
#               Hostinger "Compose from URL" link keep working.
#   production  this file + docker-compose.prod.yml (prod's existing volumes,
#               host nginx instead of Caddy, ports). Prod's .env sets
#               COMPOSE_FILE so a bare `docker compose` there picks up both.
#   local dev   this file + docker-compose.dev.yml (build from source, dev
#               ports, the dev database volume); dev-up.sh wraps it.
#
# Zero configuration required — a bare `up` boots a working app on
# http://<server-ip>:
#
#   docker compose -p gdx -f docker-compose.yml up -d
#
# What happens on first boot, in order:
#   1. secrets-init mints strong secrets (session/JWT/encryption keys, DB and
#      redis passwords) and persists them to the `gdx_secrets` volume —
#      restarts and updates reuse them, so logins and encrypted data survive.
#   2. postgres + redis start; the app runs migrations and seeds YOUR admin
#      account — the generated password is printed ONCE in the app logs
#      (Docker Manager → app container → Logs, look for the banner).
#   3. Caddy serves the app on port 80 — or with automatic HTTPS on your
#      domain once GDX_DOMAIN is set (point the domain's DNS A record at
#      this server first).
#   4. A backup sidecar dumps the database daily to the `gdx_backups` volume
#      (30-day retention).
#
# Optional settings (environment variables — all have working defaults):
#   GDX_TENANT_NAME   Your company name, shown throughout the app.
#   GDX_ADMIN_EMAIL   Login email for the first admin account.
#   GDX_DOMAIN        e.g. dispatch.yourcompany.com → enables automatic HTTPS.
#   APP_VERSION       Release tag to run (default: latest). Redeploying this
#                     project pulls the newest image = the update path.
#   GDX_ADMIN_PASSWORD  Set to choose the admin password (otherwise generated
#                     and printed once to the app logs).
#   STRIPE_SECRET_KEY / GOOGLE_MAPS_API_KEY / QB_CLIENT_ID … integration
#                     credentials; all optional, features disable when blank.
#
# Data lives in named volumes (gdx_db_data, gdx_uploads, gdx_recordings,
# gdx_backups, gdx_secrets, …) — `docker compose down` without `-v` never
# touches them.
# License: AGPL-3.0 with plugin exception. https://github.com/freePerro/gdx_dispatch
# ═══════════════════════════════════════════════════════════════════════════

# Platform mailbox + ops-alert recipient (GDXA-271). Its own anchor, merged
# into app and the two celery workers only — NOT into *app-env, which
# plugin-host also merges, and plugin-host runs third-party code that has no
# business holding the mailbox password. The workers need it: the alarm checks
# that email OPS_ALERT_EMAIL run there (modules/error_sink/ops_alert.py).
# Blank host = outbound platform mail off. Unset OPS_ALERT_EMAIL = the alert
# channel off.
x-platform-mail: &platform-mail
  PLATFORM_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
  PLATFORM_SMTP_PORT: ${PLATFORM_SMTP_PORT:-465}
  PLATFORM_SMTP_USER: ${PLATFORM_SMTP_USER:-}
  PLATFORM_SMTP_PASS: ${PLATFORM_SMTP_PASS:-}
  OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}

# Shared by every app-image container so they can never drift apart. Secrets
# are deliberately NOT here — secrets-init mints + persists them, and
# entrypoint.sh loads them via GDX_RUNTIME_ENV_FILE. Setting any of them as
# an env var here still wins: mint_runtime_env folds non-empty env values
# into the persisted file.
x-app-env: &app-env
  GDX_ENV: ${GDX_ENV:-production}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  REDIS_URL: redis://redis:6379/0
  GDX_RUNTIME_ENV_FILE: /secrets/runtime.env
  # Let a webhook subscription target the bundled n8n at http://n8n:5678 (a
  # Docker-internal RFC1918 address the SSRF guard would otherwise block). Exact
  # host only. This is how business events reach n8n: the app (tri-homed) posts
  # to it — plugin-host is isolated from n8n by design and cannot.
  GDX_WEBHOOK_PRIVATE_ALLOW: ${GDX_WEBHOOK_PRIVATE_ALLOW:-n8n}
  # ── customer-facing settings (see header) ──
  GDX_DOMAIN: ${GDX_DOMAIN:-}
  GDX_TENANT_SLUG: ${GDX_TENANT_SLUG:-gdx}
  GDX_TENANT_NAME: ${GDX_TENANT_NAME:-My Door Company}
  # Tenant identity. core/tenant.py reads these; unset → the 0000…0001
  # default tenant, which is right for a fresh install. An install created
  # under a different id (production) MUST keep passing its own, or the app
  # serves an empty tenant.
  GDX_TENANT_ID: ${GDX_TENANT_ID:-}
  GDX_DEFAULT_TENANT_ID: ${GDX_DEFAULT_TENANT_ID:-}
  # 1 = bootstrap_app refuses (exit 1) instead of seeding when the tenant row
  # is missing. Production sets it in .env: the base file alone on that box
  # would mount a new, empty database and answer 200 on /health. With this
  # set, that run crash-loops loudly instead (one-layout plan, audit finding 1).
  GDX_REQUIRE_EXISTING_DATA: ${GDX_REQUIRE_EXISTING_DATA:-}
  # ── optional secret overrides (blank = minted on first boot) ──
  SECRET_KEY: ${SECRET_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
  GDX_FERNET_KEY: ${GDX_FERNET_KEY:-}
  FERNET_KEY: ${FERNET_KEY:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  # Gates plugin-host's /internal/* routes (#596). secrets-init mints this
  # into /secrets/runtime.env, which entrypoint.sh sources over the container
  # env — so blank here means "use the minted one", same as the keys above.
  GDX_INTERNAL_TOKEN: ${GDX_INTERNAL_TOKEN:-}
  # Hosts the plugin browser-stream may navigate to. Documented as an operator
  # override in plugin_host/browser_stream.py and, until now, in no compose
  # environment block at all — the same #598 shape as GDX_INTERNAL_TOKEN: an
  # operator sets it, nothing happens, and there is no error saying why. Only
  # plugin-host reads it, but it rides the shared block so the two stacks that
  # merge this file cannot drift.
  PLUGIN_BROWSER_ALLOWED_HOSTS: ${PLUGIN_BROWSER_ALLOWED_HOSTS:-}
  GDX_PUBLIC_BASE_URL: ${GDX_PUBLIC_BASE_URL:-}
  # Finding the client address behind the proxy (core/client_ip.py, GDXA-1597).
  # GDX_TRUSTED_PROXIES: which socket peers may speak for the client; blank =
  # loopback + private ranges. GDX_TRUSTED_UPSTREAM_PROXIES: proxies in front
  # of nginx, stepped through in X-Forwarded-For; blank = none. Behind
  # Cloudflare without nginx real_ip, set it to `cloudflare`, or every client
  # is its Cloudflare edge address. Never "*" in either.
  GDX_TRUSTED_PROXIES: ${GDX_TRUSTED_PROXIES:-}
  GDX_TRUSTED_UPSTREAM_PROXIES: ${GDX_TRUSTED_UPSTREAM_PROXIES:-}
  GDX_BASE_URL: ${GDX_BASE_URL:-}
  RS_PRIVATE_KEY: ${RS_PRIVATE_KEY:-}
  RS_PUBLIC_KEY: ${RS_PUBLIC_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_PRIVATE_KEY_B64: ${VAPID_PRIVATE_KEY_B64:-}
  # Plugin browser-stream session recording. Set to 0 to disable.
  # The directory is NOT under /app/uploads on purpose: that tree is what the DB
  # backup routine takes off-box, and these recordings are unscrubbed. It has
  # its own volume (gdx_recordings) on app.
  GDX_SESSION_RECORDING: ${GDX_SESSION_RECORDING:-1}
  GDX_SESSION_RECORDING_DIR: ${GDX_SESSION_RECORDING_DIR:-/app/recordings}
  # ── optional integrations (features disable when blank) ──
  # Personal-cell webhook (cellcomms plugin's live feed) — blank = gate
  # fails closed, feed off. Only useful with the plugin installed.
  CELL_GATEWAY_WEBHOOK_SECRET: ${CELL_GATEWAY_WEBHOOK_SECRET:-}
  # Inbound-email webhook caller secret. This block is an ALLOWLIST, not an
  # env_file: a var absent here never reaches the container whatever .env
  # says, and the gate that reads it then behaves as "not configured".
  INBOUND_EMAIL_WEBHOOK_SECRET: ${INBOUND_EMAIL_WEBHOOK_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  QB_CLIENT_ID: ${QB_CLIENT_ID:-}
  QB_CLIENT_SECRET: ${QB_CLIENT_SECRET:-}
  QB_REDIRECT_URI: ${QB_REDIRECT_URI:-}
  QB_ENVIRONMENT: ${QB_ENVIRONMENT:-production}

services:
  # Mints + persists runtime secrets before anything else starts. Runs on
  # every `up`; a no-op once the values exist.
  secrets-init:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    entrypoint: ["python", "-m", "gdx_dispatch.tools.mint_runtime_env"]
    # Root on purpose: a fresh named volume is root-owned. The tool chowns
    # everything to the app user (uid 1000) before exiting.
    user: "0:0"
    environment:
      <<: *app-env
      # Mints n8n's encryption key + db password into their OWN volume
      # (gdx_n8n_secrets). n8n mounts ONLY that volume — never gdx_secrets — so
      # its Code node can't read the GDX secret set. Runs even when the
      # automation profile is off, so enabling n8n later reuses the persisted key
      # instead of orphaning stored credentials.
      GDX_N8N_SECRETS_DIR: /n8n-secrets
    volumes:
      - gdx_secrets:/secrets
      - gdx_n8n_secrets:/n8n-secrets
    networks: [backend]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gdx
      POSTGRES_USER: gdx
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - gdx_db_data:/var/lib/postgresql/data
      - gdx_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdx -d gdx"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # --requirepass from the minted secret so an untrusted container that reaches
    # redis (the Celery broker) can't inject tasks into DB-credentialed workers.
    # `$(cat …)` strips the trailing newline, matching REDIS_URL's copy.
    # Also the auth store: used_refresh_jtis and refresh_family:{sub} are the
    # refresh-token replay and family-revoke state (invariant 7). noeviction
    # refuses the write at the cap instead of silently dropping replay history;
    # AOF on a named volume keeps that state across `down` (GDXA-1117).
    command: >
      sh -c 'exec redis-server --requirepass "$$(cat /secrets/redis_password)"
      --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes'
    volumes:
      - gdx_secrets:/secrets:ro
      - gdx_redis_data:/data
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backend]
    restart: unless-stopped

  # Runs migrations + first-boot bootstrap (tenant, company, admin account),
  # then serves the app. The other app-image services skip both — exactly one
  # container ever touches the schema.
  app:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    environment:
      <<: [*app-env, *platform-mail]
      APP_VERSION: ${APP_VERSION:-latest}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      GDX_ADMIN_EMAIL: ${GDX_ADMIN_EMAIL:-admin@example.com}
      # Where the in-app plugin storefront reads its curated catalog. Empty
      # falls back to the built-in default, so an operator only sets this to
      # point at a different catalog host.
      GDX_PLUGIN_CATALOG_URL: ${GDX_PLUGIN_CATALOG_URL:-}
      GDX_ADMIN_PASSWORD: ${GDX_ADMIN_PASSWORD:-}
      # ── app-only: read by HTTP routes, which only this service serves ──
      # Scrape secret for GET /metrics; blank = the endpoint refuses.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      QB_WEBHOOK_VERIFIER_TOKEN: ${QB_WEBHOOK_VERIFIER_TOKEN:-}
      POWER_APPS_TENANT_ID: ${POWER_APPS_TENANT_ID:-}
      POWER_APPS_CLIENT_ID: ${POWER_APPS_CLIENT_ID:-}
      GDX_MICROSOFT_SECRET_KEY: ${GDX_MICROSOFT_SECRET_KEY:-}
      OUTLOOK_BOOTSTRAP_TENANT_SLUG: ${OUTLOOK_BOOTSTRAP_TENANT_SLUG:-gdx}
    volumes:
      - gdx_uploads:/app/uploads
      # Session recordings. Their OWN volume, not a subdirectory of
      # uploads: admin_db.py writes DB backups into /app/uploads/_db_backups, and
      # these recordings are unredacted session captures that must not ride along
      # in every backup artifact that leaves the machine. (Missing from this
      # layout until 2026-10-19, so recordings lived in the container layer and
      # died with every update — ledger 1280.)
      - gdx_recordings:/app/recordings
      - gdx_secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      # 5s was not enough for a COLD probe: /health does a DB round-trip, and the
      # first one after a recreate measured 5.28s on the demo stack.
      timeout: 10s
      retries: 5
      # THE load-bearing line. entrypoint.sh runs create_all + `alembic upgrade
      # head` (every revision in migrations/versions/) and only THEN execs
      # uvicorn, so /health cannot answer until migrations finish. With no start_period the probe starts immediately
      # and burns all 5 retries in ~50s, marking the app unhealthy while it is
      # merely still migrating -- and every service gated on `app:
      # service_healthy` then refuses to start.
      start_period: 180s
    # Tri-homed: backend (db/redis/plugin-host), edge (caddy→app), automation
    # (n8n→app for the gdx_live_ API). n8n reaching app is the intended inbound
    # path — app routes are all auth-gated; the /internal/* routes live on
    # plugin-host (backend), which n8n cannot reach.
    networks: [backend, edge, automation]
    restart: unless-stopped

  # All installed third-party plugins run here, isolated from the core app
  # (ADR-013). Internal-only; core proxies /api/plugins/* over the network.
  plugin-host:
    image: ghcr.io/freeperro/gdx_dispatch-plugin-host:${APP_VERSION:-latest}
    pull_policy: always
    command: uvicorn gdx_dispatch.plugin_host.main:app --host 0.0.0.0 --port 8000
    # Chromium exhausts Docker's default 64MB /dev/shm without this (ADR-014).
    ipc: host
    environment:
      <<: *app-env
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
      # Discovery compares a plugin's `requires` ("gdx>=X.Y.Z") against THIS
      # value; a plugin-host without it reads as version 0 and skips every
      # version-pinned plugin with a log line (found 2026-09-20: prod's had
      # none). Same source as app's. An unpinned host ("latest"/"dev") also
      # reads as 0 — pin APP_VERSION to load a pinned plugin.
      APP_VERSION: ${APP_VERSION:-latest}
    volumes:
      - gdx_plugins:/plugins
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      # Shorter than the app's: plugin-host runs no migrations, and its known
      # failure mode is a boot HANG in reconcile on a no-egress host -- which
      # should surface promptly, not be masked by a long grace period.
      start_period: 60s
    networks: [backend]
    restart: unless-stopped

  celery-high:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    # -c 2 (not prod's 4): customer boxes are 2-vCPU/8GB KVMs also running
    # postgres + Chromium-capable plugin-host; 8 prefork workers would eat
    # the box for queues a single shop never fills.
    command: celery -A gdx_dispatch.core.celery_app worker -Q priority:high -c 2 --loglevel=info
    environment:
      <<: [*app-env, *platform-mail]
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
    volumes:
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    # ALSO on automation: webhook + plugin delivery run here (priority:high), and
    # a subscription targeting the bundled n8n (http://n8n:5678) must be
    # reachable. celery has no inbound port, so joining automation does NOT let
    # n8n reach it — isolation holds (n8n still can't reach db/redis/plugin-host).
    # Caught by the throwaway-VPS E2E: without this, deliveries to n8n fail with a
    # connection error because n8n is automation-only.
    networks: [backend, automation]
    restart: unless-stopped

  celery-low:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    command: celery -A gdx_dispatch.core.celery_app worker -Q priority:low -c 1 --loglevel=info
    environment:
      <<: [*app-env, *platform-mail]
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
    volumes:
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/freeperro/gdx_dispatch:${APP_VERSION:-latest}
    pull_policy: always
    command: celery -A gdx_dispatch.core.celery_app beat --loglevel=info
    environment:
      <<: *app-env
      GDX_SKIP_MIGRATIONS: "1"
      GDX_SKIP_BOOTSTRAP: "1"
    volumes:
      - gdx_secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  # Public entrypoint. No GDX_DOMAIN → plain HTTP on port 80 (first boot,
  # http://<server-ip>). With GDX_DOMAIN set and its DNS A record pointing
  # here, Caddy obtains + renews Let's Encrypt certificates automatically;
  # the cert store lives on gdx_caddy_data so reissue limits are never hit.
  caddy:
    image: caddy:2-alpine
    environment:
      GDX_DOMAIN: ${GDX_DOMAIN:-}
      GDX_N8N_ENABLED: ${GDX_N8N_ENABLED:-}
    # Generate a Caddyfile then run it (the old `caddy reverse-proxy` one-liner
    # can express only ONE route, so it can't add the n8n subdomain). Three
    # branches: no domain → plain :80 (bare-IP first boot); domain → auto-HTTPS;
    # domain AND GDX_N8N_ENABLED=1 → also serve n8n.<domain>. The n8n block is
    # gated on an EXPLICIT env, not on the domain being set — so it exists only
    # after the operator has pointed the 2nd A record, and Caddy never burns
    # Let's Encrypt failed-validation limits retrying a missing n8n host. Never
    # `depends_on: n8n` (a hard error when the automation profile is off);
    # reverse_proxy resolves n8n at request time and 502s harmlessly if absent.
    command: >
      sh -c 'CF=/etc/caddy/Caddyfile;
      if [ -z "$$GDX_DOMAIN" ]; then
      printf ":80 {\n  reverse_proxy app:8000\n}\n" > $$CF;
      else
      printf "%s {\n  reverse_proxy app:8000\n}\n" "$$GDX_DOMAIN" > $$CF;
      if [ "$$GDX_N8N_ENABLED" = "1" ]; then
      printf "n8n.%s {\n  reverse_proxy n8n:5678\n}\n" "$$GDX_DOMAIN" >> $$CF;
      fi;
      fi;
      echo "--- generated Caddyfile ---"; cat $$CF;
      exec caddy run --config $$CF --adapter caddyfile'
    ports:
      - "${GDX_HTTP_PORT:-80}:80"
      - "${GDX_HTTPS_PORT:-443}:443"
    volumes:
      - gdx_caddy_data:/data
      - gdx_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    # edge (→app) + automation (→n8n). NOT backend — caddy needs neither db,
    # redis, nor plugin-host.
    networks: [edge, automation]
    restart: unless-stopped

  # Daily logical dump, independent of (and complementing) host snapshots.
  # pipefail + write-to-partial-then-rename so a failing pg_dump can never
  # masquerade as a good backup (gzip alone exits 0 on an empty pipe).
  # Restore: gunzip -c <file> | docker compose exec -T db psql -U gdx gdx
  #
  # ALSO copies runtime.env into the backup set: without the encryption keys a
  # pg_dump is UNREADABLE after a restore to a fresh box (every EncryptedString
  # column). This closed a pre-existing DR hole. And dumps the n8n database when
  # the automation profile added it (n8n-db is reachable on the automation net).
  # ⚠ gdx_backups now holds runtime.env (ALL secrets in plaintext) — treat that
  # volume as secret-bearing wherever it's copied off-box.
  backup:
    image: postgres:16-alpine
    entrypoint: >
      sh -c 'set -o pipefail; export PGPASSWORD="$$(cat /secrets/db_password)";
      while true; do
      ts="$$(date +%Y%m%d_%H%M%S)";
      if pg_dump -h db -U gdx gdx | gzip > /backups/.partial.gz;
      then mv /backups/.partial.gz "/backups/gdx_$${ts}.sql.gz"
      && echo "[backup] wrote gdx_$${ts}.sql.gz";
      else rm -f /backups/.partial.gz;
      echo "[backup] FAILED — pg_dump error, no backup written" >&2; fi;
      cp /secrets/runtime.env "/backups/runtime.env.bak" 2>/dev/null
      && echo "[backup] saved runtime.env (needed to decrypt a restore)";
      if PGPASSWORD="$$(cat /n8n-secrets/db_password)" pg_dump -h n8n-db -U n8n n8n | gzip > /backups/.n8n.partial.gz 2>/dev/null;
      then mv /backups/.n8n.partial.gz "/backups/n8n_$${ts}.sql.gz"
      && echo "[backup] wrote n8n_$${ts}.sql.gz";
      else rm -f /backups/.n8n.partial.gz; fi;
      find /backups -name "gdx_*.sql.gz" -mtime +${GDX_BACKUP_RETAIN_DAYS:-30} -delete;
      find /backups -name "n8n_*.sql.gz" -mtime +${GDX_BACKUP_RETAIN_DAYS:-30} -delete;
      sleep 86400; done'
    volumes:
      - gdx_secrets:/secrets:ro
      - gdx_n8n_secrets:/n8n-secrets:ro
      - gdx_backups:/backups
    depends_on:
      # app healthy (not just db) so the first dump captures a migrated
      # schema instead of an empty pre-bootstrap database.
      app:
        condition: service_healthy
    # backend (dump db) + automation (dump n8n-db when present).
    networks: [backend, automation]
    restart: unless-stopped

  # ── Optional automation (n8n) — enabled with COMPOSE_PROFILES=automation ──
  # Runs UNTRUSTED tenant workflows, so it lives ONLY on the `automation`
  # network: it can reach app (the gdx_live_ API) and its own database, but NOT
  # db, redis, or plugin-host (the money/broker/internal surfaces). Its
  # encryption key + DB password come from the dedicated gdx_n8n_secrets volume;
  # n8n never mounts gdx_secrets, so its Code node can't read the GDX secret set.
  # ⚠ Pair COMPOSE_PROFILES=automation WITH GDX_N8N_ENABLED=1: the profile runs
  # n8n, the flag adds its Caddy route. Profile without flag = n8n unreachable;
  # flag without profile = Caddy provisions a cert for a host that isn't there.
  n8n-db:
    image: postgres:16-alpine
    profiles: ["automation"]
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /n8n-secrets/db_password
    volumes:
      - gdx_n8n_db_data:/var/lib/postgresql/data
      - gdx_n8n_secrets:/n8n-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [automation]
    restart: unless-stopped

  n8n:
    # Pinned — n8n releases weekly; bump this with our releases like APP_VERSION.
    image: n8nio/n8n:1.108.2
    profiles: ["automation"]
    mem_limit: 512m
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /n8n-secrets/db_password
      # Managed key (one-way door: decided day one, so a later switch can't hit
      # n8n's "Mismatching encryption keys" crash). Read from the file untrimmed.
      N8N_ENCRYPTION_KEY_FILE: /n8n-secrets/encryption_key
      # Behind Caddy at n8n.<domain> — otherwise the editor renders localhost
      # webhook URLs and inbound webhooks/OAuth callbacks break.
      N8N_HOST: n8n.${GDX_DOMAIN:-}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: https://n8n.${GDX_DOMAIN:-}/
      WEBHOOK_URL: https://n8n.${GDX_DOMAIN:-}/
      # Isolate Code-node execution in a task runner (else it runs in-process —
      # unacceptable for a container running untrusted workflows).
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - gdx_n8n_secrets:/n8n-secrets:ro
      - gdx_n8n_data:/home/node/.n8n
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      n8n-db:
        condition: service_healthy
    networks: [automation]
    restart: unless-stopped

# Three isolated networks enforce the trust boundary. n8n sits ONLY on
# `automation`, so it can never open a socket to db/redis/plugin-host — the
# single highest-leverage control once an untrusted-workflow container shares
# the box. app is tri-homed (it legitimately talks to everything); caddy bridges
# edge+automation for ingress; backup bridges backend+automation to dump both
# databases.
networks:
  backend:
  edge:
  automation:

# All managed (auto-created on first deploy — required for one-click), and
# reused as long as the compose project name stays the same. Redeploying the
# project updates containers but keeps these. docker-compose.prod.yml maps the
# data volumes onto production's existing ones instead.
volumes:
  gdx_db_data:
  gdx_redis_data:
  gdx_uploads:
  # Plugin browser-stream session recordings (see the app service). The spool,
  # not the archive: tools/pull_browser_sessions.sh copies sessions off the box,
  # and that copy is the durable one.
  gdx_recordings:
  gdx_plugins:
  gdx_secrets:
  gdx_backups:
  gdx_caddy_data:
  gdx_caddy_config:
  gdx_n8n_secrets:
  gdx_n8n_data:
  gdx_n8n_db_data:

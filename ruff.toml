# ruff.toml — GDX Dispatch
# Replaces flake8 + isort in one tool (150-200x faster). NOT black, and not any
# other formatter: no formatter has ever been wired in this repo, checked over
# its whole commit history. There is no [format] table below, no formatter step
# in .github/workflows/ci.yml, no pre-commit config and no .editorconfig. Nor
# does any repo tooling run `ruff check --fix`, so the autofixable rules below
# only ever rewrite code when a developer invokes them by hand.
#
# Linting is enforced as a RATCHET, not pass/fail: gdx_dispatch/tools/ruff_ratchet.sh
# compares the violation count against a floor kept in .ruff_baseline. Read that
# file for the number rather than trusting a copy in prose — the script rewrites
# it whenever the count drops, so any figure quoted here would go stale with
# nothing able to fail for it. One scope gap worth knowing: the ratchet's target
# is `gdx_dispatch/` only, so tracked .py files outside it (conftest.py,
# plugins/, scripts/, tools/) obey these rules but are gated by nothing.
#
# Adopting a formatter is a maintainer decision deliberately left open, and not
# a small one: at the CI pin (ruff 0.15.18), measured 2026-09-27, it would
# rewrite 1300 of the 1401 files under gdx_dispatch/, and the baseline would
# have to be refrozen in the same change.

# Read by the `I` (isort) autofix, which wraps an import block it rewrites at
# this width — verified 2026-09-27 at the CI pin: the same block fixes to one
# line under 120 and to one name per line under 40. That autofix is its only
# consumer here today. It does not cap line length for the gate (E501 is
# ignored below) and no formatter reads it, so a line over 120 characters is
# not a finding anywhere in this repo.
line-length = 120

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear (catches common bugs)
    "S",     # flake8-bandit (security)
    "UP",    # pyupgrade (modernize syntax)
    "SIM",   # flake8-simplify
]
ignore = [
    # E501: line length is not enforced in this repo by anything. It is ignored
    # here, and no formatter runs to enforce it instead (see the header). The
    # "handled by formatter" this line claimed until 2026-09-27 was never true —
    # there has never been a formatter to hand it to. Lifting the ignore is not
    # a free tidy-up: under gdx_dispatch/ alone it surfaces 756 violations
    # across 197 files (32 of them over 200 characters, longest 304), measured
    # 2026-09-27 at the CI pin — far above the .ruff_baseline floor, so it reds
    # the ratchet on the first run.
    "E501",
    "S101",  # assert used — needed in tests
    "S108",  # Probable insecure usage of temp file — we use /tmp intentionally
    "S603",  # subprocess call - check for execution of untrusted input
    "S607",  # Starting a process with a partial executable path
]

[lint.isort]
# First-party packages. Without this, ruff groups `gdx_dispatch.*`
# alphabetically with third-party imports (fastapi, pydantic).
known-first-party = ["gdx_dispatch"]

[lint.per-file-ignores]
"dispatch/tests/**" = ["S101", "S106", "B011"]
"gdx_dispatch/tests/**" = ["S101", "S106", "B011", "S105", "S110", "S112", "E402", "B017"]  # scaffold/fixture idioms
"gdx_dispatch/tools/**" = ["S603", "S607", "S310"]
# B008: FastAPI dependency injection idiom — `Depends(...)` in defaults is
# the documented pattern, not a mutable-default bug.
"gdx_dispatch/routers/**" = ["B008"]
"plugins/**" = ["B008"]  # plugin routers are FastAPI routers too
"gdx_dispatch/app.py" = ["B008"]
"gdx_dispatch/core/middleware/**" = ["B008"]
# S608 in mobile.py: all sites build SQL from code-controlled column name lists
# (list(values.keys()), static where-clauses). Values always bound via :params.
"gdx_dispatch/routers/mobile.py" = ["B008", "S608"]
# GDPR test files contain pytest.skip(..., allow_module_level=True) at top — bodies
# are stale scaffolds awaiting rewrite. F821s are expected until rewrite lands.
"gdx_dispatch/tests/test_gdpr_enhanced.py" = ["F821", "S101", "S106", "B011"]
"gdx_dispatch/tests/test_38_data_export.py" = ["F821", "S101", "S106", "B011"]
"gdx_dispatch/tests/test_07_gdpr_deletion.py" = ["F821", "S101", "S106", "B011"]
"gdx_dispatch/core/**" = ["B008"]  # FastAPI Depends() pattern across all core routers/deps
"gdx_dispatch/integrations/**" = ["B008"]  # FastAPI Depends() in integration router modules
"gdx_dispatch/modules/**" = ["B008"]  # FastAPI Depends() in feature-module routers (customer_portal, etc.)
"gdx_dispatch/tests/e2e/**" = ["S501", "S101", "S106", "B011"]  # tests hit local test server; S501 intentional
"gdx_dispatch/tools/router_sql_live_audit.py" = ["S608"]  # audit tool introspects schema; column names are code-controlled

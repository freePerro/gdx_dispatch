name: CI — Test & Build

# Least-privilege default; no job needs write access to repo contents.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'gdx_dispatch/**'
      - 'gdx_dispatch/docker/**'
      - '.github/workflows/**'
      - '!**/*.md'
  pull_request:
    branches: [main]
  # Fired by post-merge-dispatch.yml: a merge made with GITHUB_TOKEN (every
  # auto-merge) starts no push run above (GDXA-751).
  workflow_dispatch:

# Cancel superseded runs when a newer push lands on the same branch.
# The autonomous Claude ↔ Codex loop pushes every few minutes; without
# this, every push queues a full 10-min run even when obsolete before it
# starts. Saved 100s of Actions-minutes after we hit the 3000 limit.
# Main is exempt: a main run is the only test of what merged, so it
# finishes and the next one waits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Live lint/syntax gate. Preserved from the retired fast-gate.yml so the
  # ruff ratchet (.ruff_baseline) + hard F821/F823 gate survive the workflow
  # cleanup — these target the current gdx_dispatch/ tree, not the old app.
  # F811 outside gdx_dispatch/tests joined the hard gate in #475.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        # Pinned: the ratchet baseline (.ruff_baseline) is version-specific —
        # a ruff bump that adds/changes rules would shift the count and
        # false-fail. Bump deliberately + re-baseline together.
        run: pip install ruff==0.15.18

      - name: Ruff full ruleset (ratchet — fails only if count increases)
        # The gate is a script, not an inline block, so its own failure modes
        # are reachable from a test: gdx_dispatch/tests/test_ruff_ratchet_gate.py.
        # Three ways this step used to report success without measuring
        # anything are documented and guarded in that script.
        run: bash gdx_dispatch/tools/ruff_ratchet.sh

      - name: No tracked file matches an ignore rule
        # Once a path is tracked its .gitignore line does nothing, so a run
        # artifact committed by accident is refreshed by every later run and
        # drifts in diffs (GDXA-1595: frontend/e2e-route-report.json). Here,
        # not in pytest: the docker-app image has no git binary, and matching
        # .gitignore in python would only approximate what git decides.
        run: |
          offenders="$(git ls-files -ci --exclude-standard)"
          if [ -n "$offenders" ]; then
            echo "::error::tracked files that .gitignore ignores — git rm --cached them, or narrow the ignore rule:"
            echo "$offenders"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    # Backstop for wedged shards: a hung test used to sit at the default
    # 6-hour job limit (2026-07-06: every run wedged in shard 4 for hours).
    # Normal shard wall time is ~9-13 min; 45 min means "hung", not "slow".
    timeout-minutes: 45
    # pytest-split shard matrix. The repo deliberately disabled xdist (`-n`):
    # benchmarks (2026-04-24) showed N=7 splits beat `-n 14` by ~17% AND
    # eliminated the cross-worker-fixture-race flakiness xdist introduced
    # (see pytest.ini + gdx_dispatch/tools/run_tests_split.sh). Each shard is
    # an independent pytest process — no shared-fixture protocol between them.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gdx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gdx_dispatch/requirements.lock

      - name: Install dependencies
        # From the LOCK, the set the images ship (GDXA-467): requirements.txt
        # states ranges, and resolving them fresh here tested whatever PyPI
        # held that minute. --no-deps: a package missing from the lock fails
        # the run instead of being resolved silently; `pip check` fails an
        # inconsistent set. The lock pins pytest-split / pytest-asyncio (and
        # pytest). It still pins pytest-xdist too, but CI no longer uses it —
        # the split matrix below replaces the old `-n auto` invocation.
        run: |
          pip install --no-deps -r gdx_dispatch/requirements.lock
          pip check

      - name: PostgreSQL client matching the service
        # test_pave_rebuild_pg.py dumps and reloads with pg_dump/psql, and a
        # client newer than the server writes GUCs (transaction_timeout) that
        # the server refuses under ON_ERROR_STOP. The bare pg_dump on PATH is
        # pg_wrapper, which picks the NEWEST installed client, so the test
        # looks in /usr/lib/postgresql/<server major>/bin first (GDXA-1169).
        # ubuntu-24.04 ships PostgreSQL 16, so today this only prints the
        # versions; a runner image without a 16 gets it from the PGDG apt repo
        # (checked on ubuntu:26.04, 2026-10-14). Keep PG_MAJOR in lockstep with
        # services.postgres.image above. The runner is deliberately not pinned:
        # that would freeze every shard's image to work around one test's tool.
        env:
          PG_MAJOR: "16"
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ ! -x "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y -q --no-install-recommends "postgresql-client-$PG_MAJOR"
          fi
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --version
          "/usr/lib/postgresql/$PG_MAJOR/bin/psql" --version

      - name: Run tests (pytest-split shard ${{ matrix.group }}/7)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gdx_test
          # 33 Postgres tests — incl. the GL trigger/engine money guards — take
          # their connection from GDX_TEST_PG_*, not DATABASE_URL, and default
          # to a laptop's 127.0.0.1:5433 gdx/gdx: tests/fixtures/pg.py,
          # test_gl_triggers.py, test_gl_engine_pg.py. Without these five they
          # all skipped green here (#440). Under CI those tests now FAIL rather
          # than skip when they cannot connect (fixtures/pg.py::_skip_unless_ci),
          # so dropping or breaking these reddens the shard.
          GDX_TEST_PG_HOST: localhost
          GDX_TEST_PG_PORT: "5432"
          GDX_TEST_PG_USER: test
          GDX_TEST_PG_PASSWORD: test
          GDX_TEST_PG_ADMIN_DB: gdx_test
          # The conftest.py guard only blocks a bare serial full-suite run;
          # split shards are the sanctioned fast path, but set the bypass
          # explicitly so the guard never trips in CI. Serial tests under
          # gdx_dispatch/tests/serial/ are included — pytest-split assigns
          # each to a shard and runs it in that shard's single process.
          PYTEST_DISABLE_SPLIT_GUARD: "1"
          # Don't write .pyc in CI — pure overhead for a throwaway runner.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # UNFORKED since 2026-08-04 (assessment §7 item 4). History: --forked
          # (pytest-forked, ~4x slower) contained the #20 native SIGSEGV (an
          # anyio/TestClient teardown race). PR #60 (2026-06-27) dropped it and
          # shard 1 segfaulted, so it stayed. Re-tested 2026-08-04 on the
          # post-#58 tree: 17 unforked shard runs, ZERO segfaults (the one
          # failure was env pollution from a bogus import-time DATABASE_URL,
          # fixed in the same PR). The retry below is now the load-bearing
          # backstop: a residual #20 crash retries the shard once; two crashes
          # in a row fail the job. If shards start hitting the retry regularly,
          # revert to --forked here AND flip FORKED=1 in
          # gdx_dispatch/tools/run_tests_split.sh (kept in lockstep).
          # Native-crash exit codes (128+signal): 134=SIGABRT, 135=SIGBUS,
          # 139=SIGSEGV — the #20 class can surface as any of them. Retry
          # once on those only; assertion failures (exit 1) fail fast.
          #
          # -ra (pytest's own alias for "sxXEf") NAMES every skip, xfail, XPASS,
          # error and failure instead of printing a bare count. Kept in lockstep
          # with COMMON_OPTS in gdx_dispatch/tools/run_tests_split.sh, same as
          # --forked above. Never -rs: -r REPLACES pytest's "fE" default rather
          # than adding to it, so -rs would delete the FAILED and ERROR summary
          # lines (see that script's comment). Under CI an unreachable Postgres
          # FAILS rather than skips (#440). The TEST_DATABASE_URL AI role tests
          # skip here and run in the ai-roles job below (GDXA-1564); the
          # GDX_TEST_CONTROL_DB_URL tests still skip green — this names them. Report-only: it cannot change a verdict.
          #
          # No -q here: pytest.ini addopts already carries -q, and a second one
          # makes it -qq, which drops the final "N passed, M skipped" counts line
          # (GDXA-308). Guarded by gdx_dispatch/tests/test_ci_pytest_verbosity.py.
          set +e
          python -m pytest gdx_dispatch/tests/ --ignore=gdx_dispatch/tests/e2e \
            --splits 7 --group ${{ matrix.group }} --tb=short -ra \
            -p no:nose -p no:pastebin -p no:doctest --durations=15
          rc=$?
          set -e
          case "$rc" in
            134|135|139)
              echo "::warning::pytest died with exit ${rc} (native crash, #20 class). Retrying shard once."
              python -m pytest gdx_dispatch/tests/ --ignore=gdx_dispatch/tests/e2e \
                --splits 7 --group ${{ matrix.group }} --tb=short -ra \
                -p no:nose -p no:pastebin -p no:doctest --durations=15
              ;;
            *)
              exit "$rc"
              ;;
          esac

  # The AI role tests (test_gdx_ai_readonly_role.py, test_gdx_ai_write_role.py)
  # need a paved tenant database with gdx_ai_readonly and gdx_ai_write already
  # created, and read only TEST_DATABASE_URL. The shards above leave it unset on
  # purpose: 40 Postgres test files read TEST_DATABASE_URL before DATABASE_URL,
  # and pointing them at a second database would change what they run against.
  # So this job builds that database itself: the ORM schema (what a pave's
  # create_all builds), one seeded customer, then the checked-in
  # gdx_dispatch/tools/gdx_ai_roles.sql, and runs the two files. It fails unless
  # exactly the expected number pass: a skip here means the contract went
  # unchecked, and a lower count means a test stopped being collected
  # (GDXA-1564). Adding a test to either file means raising EXPECTED below.
  ai-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gdx_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: gdx_ai
      # Throwaway values for a throwaway database; they protect nothing real.
      GDX_AI_READONLY_PASSWORD: ci-ai-readonly
      GDX_AI_WRITE_PASSWORD: ci-ai-write
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gdx_dispatch/requirements.lock

      - name: Install dependencies
        # Same install as the test job: the lock, --no-deps, then pip check.
        run: |
          pip install --no-deps -r gdx_dispatch/requirements.lock
          pip check

      - name: PostgreSQL client matching the service
        # gdx_ai_roles.sql reads its passwords with \getenv, which needs psql 15
        # or newer. Same install as the test job's step of this name; keep
        # PG_MAJOR in lockstep with services.postgres.image above.
        env:
          PG_MAJOR: "16"
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ ! -x "/usr/lib/postgresql/$PG_MAJOR/bin/psql" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y -q --no-install-recommends "postgresql-client-$PG_MAJOR"
          fi
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Build the tenant schema, seed a customer, apply the AI roles
        env:
          # Importing the models imports the auth router, which refuses to load
          # without a signing key. A throwaway CI value.
          JWT_SECRET: ci-ai-roles-secret-at-least-32-bytes-long
        run: |
          psql --version
          python -c "
          import gdx_dispatch.models
          from gdx_dispatch.core.audit import TenantBase
          from sqlalchemy import create_engine
          TenantBase.metadata.create_all(create_engine('postgresql://test:test@localhost:5432/gdx_ai'))
          "
          # The write tests need a row to UPDATE, and gdx_ai_write cannot INSERT one.
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO customers (id, name, company_id) VALUES (gen_random_uuid(), 'ci-seed', 'ci')"
          psql -f gdx_dispatch/tools/gdx_ai_roles.sql

      - name: Run the AI role tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/gdx_ai
          EXPECTED: "10"
        run: |
          set -o pipefail
          python -m pytest gdx_dispatch/tests/test_gdx_ai_readonly_role.py \
            gdx_dispatch/tests/test_gdx_ai_write_role.py --tb=short -ra \
            -p no:nose -p no:pastebin -p no:doctest | tee "$RUNNER_TEMP/ai_roles.out"
          # pytest exits 0 with skips. Only "$EXPECTED passed" (and warnings) counts.
          grep -Eq "^=* ?${EXPECTED} passed(, [0-9]+ warnings?)? in " "$RUNNER_TEMP/ai_roles.out" \
            || { echo "::error::expected exactly ${EXPECTED} AI role tests to pass, none skipped; see the summary above"; exit 1; }

  build:
    runs-on: ubuntu-latest
    needs: test
    # The image runs Alembic migrations at startup (gdx_dispatch/migrations/env.py
    # takes a `pg_advisory_xact_lock`, and baseline_squashed.sql is Postgres SQL),
    # so the boot smoke-test needs a real Postgres — SQLite can't satisfy it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gdx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f gdx_dispatch/docker/Dockerfile -t gdx-app:${{ github.sha }} .

      - name: Verify image starts
        run: |
          # --network host so the container reaches the postgres service on
          # localhost:5432. JWT_SECRET (>=32 bytes) is required at import or the
          # auth routers silently fail to load and the app comes up as a
          # ~7-route skeleton that would hide real breakage.
          # MASTER_ENCRYPTION_KEY (a Fernet key) is required at startup or the
          # app aborts ("STARTUP_ENCRYPTION_MISSING ... Application startup
          # failed"). This is a throwaway test key for a throwaway CI DB — it
          # protects nothing real.
          docker run -d --name gdx-test --network host \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/gdx_test \
            -e JWT_SECRET=ci-verify-image-start-secret-at-least-32-bytes \
            -e MASTER_ENCRYPTION_KEY=nsF1JvgxTAqhkYxLo4J8k-SB2JptrgzXbPVJDUOI8w4= \
            -e SECRET_KEY=ci-test \
            gdx-app:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && { ok=1; break; }
            sleep 3
          done
          [ "${ok:-}" = 1 ] || (docker logs gdx-test && exit 1)
          docker stop gdx-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gdx_dispatch/frontend/package-lock.json

      - name: Build frontend
        run: |
          cd gdx_dispatch/frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: UX gate (PrimeVue vocab, native confirm/alert, component registry)
        # The negative-test runs FIRST: it asserts each gate rule still fires
        # on synthetic violations, so a regex drift can't quietly turn the
        # gate into a no-op. Then the gate itself blocks new violations
        # (pre-existing native-confirm sites are grandfathered as WARN in
        # ux_gate.mjs pending issue #215). Neither runs under vitest —
        # ux_gate.test.mjs is a plain node CLI (see vitest.config.js exclude).
        run: |
          cd gdx_dispatch/frontend
          node scripts/ux_gate.test.mjs
          npm run lint:ux

      - name: Run vitest
        run: |
          cd gdx_dispatch/frontend
          npx vitest run

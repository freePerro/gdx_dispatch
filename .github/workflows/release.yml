name: Release

# Cut a release by pushing a semver tag:  git tag v1.2.0 && git push origin v1.2.0
# This builds the image, smoke-tests it, pushes it to GHCR as <version> + latest,
# and creates a GitHub Release. The tag needs gdx_dispatch/release_notes/<tag>.md
# on main first; the "Release notes present" step refuses without it. The
# image tag is what an install pins via APP_VERSION
# (gdx_dispatch/docker/docker-compose.yml), and the Release is what
# /api/admin/update-check compares against.
#
# Intentionally does NOT gate on the CI `test` job — releases point at an
# already-merged commit, and that job is independently red right now.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    # The image runs Alembic migrations at startup (migrations/env.py takes a
    # `pg_advisory_xact_lock`, and baseline_squashed.sql is Postgres SQL), so the
    # boot smoke-test needs a real Postgres — SQLite fails with "no such function:
    # pg_advisory_xact_lock". Mirrors the ci.yml `build` job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gdx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The s6 boot below runs the Celery workers and beat, which need a broker.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Full history + tags: the release-notes step below computes each
      # release's change list from the commits between release tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Fail before building anything when the tag has no release notes, or
      # notes older than a non-doc commit the tag includes (the full history
      # fetched above is what lets `check` see those). The
      # notes file (gdx_dispatch/release_notes/vX.Y.Z.md) must be merged to
      # main BEFORE the tag is pushed — /GDXrelease drafts it with
      # `python -m gdx_dispatch.tools.release_notes draft X.Y.Z`. On a failure
      # here nothing was published: delete the tag, merge the notes, re-tag.
      - name: Release notes present
        run: python3 -m gdx_dispatch.tools.release_notes check "${{ github.ref_name }}"

      # Per-release change lists for the in-app What's new history, computed
      # from git and baked into the image (git-ignored, never committed).
      - name: Release notes change lists
        run: python3 -m gdx_dispatch.tools.release_notes changes --write

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is owner/name; metadata-action lowercases it for
          # GHCR (which rejects uppercase) — e.g. ghcr.io/freeperro/gdx_dispatch.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gdx_dispatch/docker/Dockerfile
          build-args: |
            GIT_SHA_SHORT=${{ github.sha }}
            GDX_IMAGE_VERSION=${{ steps.meta.outputs.version }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /health
        run: |
          # --network host so the container reaches the postgres service on
          # localhost:5432. JWT_SECRET (>=32 bytes) and MASTER_ENCRYPTION_KEY (a
          # Fernet key) are both required at startup or the app aborts / loads as
          # a ~7-route skeleton. Throwaway keys for a throwaway CI DB. (Mirrors
          # ci.yml `build`.)
          img="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name rel-test --network host \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/gdx_test \
            -e JWT_SECRET=ci-verify-image-start-secret-at-least-32-bytes \
            -e MASTER_ENCRYPTION_KEY=nsF1JvgxTAqhkYxLo4J8k-SB2JptrgzXbPVJDUOI8w4= \
            -e SECRET_KEY=ci-test \
            "$img"
          ok=
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 3
          done
          docker logs rel-test
          docker rm -f rel-test
          [ "$ok" = "1" ] || { echo "image failed /health — not pushing"; exit 1; }

      - name: Smoke test the s6 boot (web, workers, beat)
        run: |
          # The way compose runs the app container: /init as root, which runs
          # entrypoint.sh once and then the four processes as appuser. The
          # bare run above only starts web. Healthy = /health answers and all
          # four are up; checked again 30 s later, so a worker that crashes
          # on its first task poll does not pass on timing.
          img="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name rel-s6 --network host --user 0:0 --entrypoint /init \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/gdx_test \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e JWT_SECRET=ci-verify-image-start-secret-at-least-32-bytes \
            -e MASTER_ENCRYPTION_KEY=nsF1JvgxTAqhkYxLo4J8k-SB2JptrgzXbPVJDUOI8w4= \
            -e SECRET_KEY=ci-test \
            "$img"
          check() { docker exec rel-s6 /etc/s6-overlay/scripts/healthcheck; }
          ok=
          for _ in $(seq 1 40); do
            if check 2>/dev/null; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" = "1" ]; then
            sleep 30
            check || ok=
          fi
          docker logs rel-s6
          docker rm -f rel-s6
          [ "$ok" = "1" ] || { echo "image failed the s6 boot — not pushing"; exit 1; }

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gdx_dispatch/docker/Dockerfile
          build-args: |
            GIT_SHA_SHORT=${{ github.sha }}
            GDX_IMAGE_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # ── Browser-capable plugin-host image (ADR-014) ─────────────────────────
      # plugin-host runs headless Chromium for browser-driving plugins, so it
      # needs its own Playwright-base image. Published as a SEPARATE GHCR repo
      # (<repo>-plugin-host) at the same version tags; docker-compose.yml
      # pins plugin-host to it. app/celery stay on the slim image above.
      - name: Plugin-host image metadata
        id: meta_ph
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-plugin-host
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build plugin-host image (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gdx_dispatch/docker/Dockerfile.plugin-host
          load: true
          tags: ${{ steps.meta_ph.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test plugin-host (Chromium launches)
        run: |
          # The whole point of this image is a working headless Chromium —
          # verify it launches. --no-sandbox is fine for a throwaway smoke run.
          img="$(printf '%s\n' "${{ steps.meta_ph.outputs.tags }}" | head -n1)"
          docker run --rm --ipc=host --entrypoint python "$img" -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage'])
              b.close()
          print('plugin-host chromium OK')
          "

      - name: Push plugin-host image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gdx_dispatch/docker/Dockerfile.plugin-host
          push: true
          tags: ${{ steps.meta_ph.outputs.tags }}
          labels: ${{ steps.meta_ph.outputs.labels }}
          cache-from: type=gha

      # The one-click compose file ships as a release asset so
      # …/releases/latest/download/docker-compose.customer.yml is a stable,
      # evergreen URL — it's what the Deploy on Hostinger button points at
      # (compose_url=) and what self-hosters paste into Docker Manager.
      # Since the one layout (2026-10-19) the asset is a copy of
      # docker-compose.yml under its old name: the URL every installed
      # customer and the README use must not change.
      # install.sh ships beside it with GDX_RELEASE stamped to this tag, so
      # …/releases/latest/download/install.sh installs (or updates to) exactly
      # this release's compose file and images (test_install_sh).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The written notes (title, highlights, warnings) lead the body; the
        # generated PR list follows. gh: "Additional release notes can be
        # prepended to automatically generated notes by using the --notes flag".
        run: |
          mkdir -p dist && cp gdx_dispatch/docker/docker-compose.yml dist/docker-compose.customer.yml
          sed 's/^GDX_RELEASE="__GDX_RELEASE__"$/GDX_RELEASE="${{ github.ref_name }}"/' gdx_dispatch/docker/install.sh > dist/install.sh
          grep -qx 'GDX_RELEASE="${{ github.ref_name }}"' dist/install.sh
          body="$(python3 -m gdx_dispatch.tools.release_notes body "${{ github.ref_name }}")"
          title="$(python3 -m gdx_dispatch.tools.release_notes body --title "${{ github.ref_name }}")"
          gh release create "${{ github.ref_name }}" --generate-notes --verify-tag \
            --title "$title" --notes "$body" \
            dist/docker-compose.customer.yml dist/install.sh

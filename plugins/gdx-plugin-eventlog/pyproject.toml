[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdx-plugin-eventlog"
version = "0.1.0"
description = "Reference plugin proving the GDX event platform: records every business event it's consented to, and shows them in a screen."
requires-python = ">=3.11"
dependencies = []

# Registers under the gdx.modules entry-point group so plugin-host discovery
# finds `manifest` after `pip install`.
[project.entry-points."gdx.modules"]
eventlog = "gdx_plugin_eventlog:manifest"

[tool.setuptools]
packages = ["gdx_plugin_eventlog"]
